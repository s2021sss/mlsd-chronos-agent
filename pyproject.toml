[project]
name = "chronos-agent"
version = "0.1.0"
description = "Автономный помощник для планирования времени: Telegram-бот + Google Calendar + LLM-агент"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4.0", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
